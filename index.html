<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 결 | 사주 운세</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap');*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29363b,#10151c 70%);color:#f5f0e7;font:14px Arial,sans-serif}.wrap{max-width:700px;margin:auto;padding:30px 20px}.brand{color:#d9bd83;letter-spacing:.15em}.hero{text-align:center;padding:65px 0 38px}.hero small{color:#d9bd83;letter-spacing:.25em}.hero h1{font:600 clamp(34px,7vw,52px)/1.4 'Noto Serif KR';margin:16px 0}.hero p,.hint{color:#aaa99f;line-height:1.8}.moon{width:80px;height:80px;border-radius:50%;margin:24px auto;background:radial-gradient(circle at 35% 30%,#f4e8c6,#b89b63);box-shadow:0 0 50px #d9bd8340}.card{background:#182027e8;border:1px solid #eaddbd26;border-radius:16px;padding:26px}h2{font:600 20px 'Noto Serif KR';margin:0 0 8px}.hint{font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;color:#c8c2b5;font-size:12px;margin:12px 0 7px}input,select{width:100%;height:46px;padding:0 12px;border-radius:8px;border:1px solid #ffffff24;background:#111820;color:#f5f0e7;font:inherit}.check{display:flex;gap:8px;align-items:center;color:#aaa;font-size:11px}button{margin-top:20px;width:100%;height:50px;border:0;border-radius:8px;background:linear-gradient(110deg,#d7c18f,#b89b63);font-weight:bold;cursor:pointer}.result{display:none;margin-top:22px}.result.show{display:block}.head{text-align:center;border-bottom:1px solid #eaddbd26;padding:8px 0 20px}.head small{color:#d9bd83}.head p,.reading p{color:#c2c1ba;line-height:1.8}.pill{color:#d9bd83;border:1px solid #d9bd8350;border-radius:20px;padding:7px 12px;font-size:11px}.scores,.reading{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:18px 0}.score,.reading article{border:1px solid #eaddbd26;border-radius:9px;padding:13px;text-align:center}.score span{display:block;color:#aaa;font-size:11px}.score b{display:block;color:#d9bd83;margin-top:5px}.reading{grid-template-columns:1fr;padding:0}.reading article{text-align:left}.reading h3{color:#e8d6ae;font:14px 'Noto Serif KR';margin:0}.reading p{font-size:12px;margin:7px 0 0}.foot{text-align:center;color:#888;font-size:10px;line-height:1.8;margin-top:20px}@media(max-width:520px){.wrap{padding:22px 14px}.hero{padding:45px 0 28px}.card{padding:20px}} </style><main class="wrap"><div class="brand">오늘의 결 <span id="date" style="float:right"></span></div><header class="hero"><small>DAILY SAJU READING</small><h1>오늘, 당신에게 흐르는<br>운의 결을 읽다</h1><p>태어난 날의 기운과 오늘의 흐름을 살펴<br>하루를 위한 작은 힌트를 전해드려요.</p><div class="moon"></div></header><section class="card"><h2>나의 정보</h2><p class="hint">태어난 날짜를 바탕으로 오늘의 운세를 확인해 보세요.</p><form id="f"><div class="grid"><div class="full"><label>이름</label><input id="n" maxlength="20" placeholder="이름을 입력해 주세요" required></div><div><label>성별</label><select id="g" required><option value="">선택해 주세요</option><option>여성</option><option>남성</option><option>기타 / 응답하고 싶지 않음</option></select></div><div><label>생년월일</label><input id="b" type="date" required></div></div><label class="check"><input id="l" type="checkbox"> 음력 생일이에요 (날짜 변환은 적용되지 않아요)</label><button>오늘의 운세 확인하기　↗</button></form><section id="r" class="result"></section></section><p class="foot">전통 사주에서 영감을 얻은 오락·참고용 콘텐츠입니다.<br>중요한 결정은 충분한 정보와 본인의 판단으로 해주세요.</p></main><script>const $=s=>document.querySelector(s),d=new Date(),fmt=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('#date').textContent=fmt.format(d);$('#b').max=new Date().toISOString().slice(0,10);const q={all:['우선순위를 하나 정하면 하루가 차분해져요. 익숙한 방식 안에 기회가 있어요.','새 제안에 열린 마음을 가져보세요. 작은 변화가 좋은 흐름으로 이어집니다.','주변을 천천히 살피면 지나친 단서가 다음 선택을 도와줘요.','쌓아온 노력이 빛을 보는 날이에요. 자신을 믿고 한 걸음 나아가세요.'],love:['솔직하고 다정한 표현이 마음의 거리를 좁혀줘요.','따뜻한 안부를 먼저 건네보세요.','끝까지 듣는 태도가 오해를 풀어줍니다.'],money:['필요한 지출을 먼저 살펴보세요. 작은 절제가 도움이 돼요.','조건을 확인하면 계획한 일에 좋은 흐름이 있어요.','본인의 기준으로 신중히 선택하세요.'],work:['집중이 잘 되는 시간에 중요한 일을 해보세요.','새 관점으로 보면 막힌 일이 풀릴 수 있어요.','마무리 점검이 좋은 결과를 만듭니다.'],health:['가볍게 몸을 움직이고 물을 자주 마셔보세요.','짧은 휴식으로 컨디션을 챙기세요.','산책으로 머리를 환기해 보세요.'],people:['작은 친절이 좋은 대화로 이어져요.','다른 의견에서도 배울 점을 찾아보세요.','고마운 마음을 전하기 좋은 날입니다.']};function H(s){let h=2166136261;for(let c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function P(a,n){return a[n%a.length]}$('#f').onsubmit=e=>{e.preventDefault();let n=$('#n').value.trim(),b=$('#b').value,h=H(b+d.toLocaleDateString('sv-SE')+$('#l').checked),score=55+h%41,yr=+b.slice(0,4),st='갑을병정무기경신임계',br='자축인묘진사오미신유술해',an=['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'],cards=[['애정운','love'],['금전운','money'],['일·학업운','work'],['건강운','health'],['대인관계운','people']];$('#r').innerHTML='<div class="head"><small>'+fmt.format(d)+'</small><h2>'+n+'님, 오늘의 기운이에요</h2><p>'+P(q.all,h)+'</p><span class="pill">'+st[(yr-4)%10]+br[(yr-4)%12]+'년 · '+an[(yr-4)%12]+'띠　|　종합운 '+score+'점</span></div><div class="scores"><div class="score"><span>행운의 숫자</span><b>'+(1+h%9)+'</b></div><div class="score"><span>행운의 색</span><b>'+P(['크림','청록','코랄','네이비','라벤더'],h>>>8)+'</b></div><div class="score"><span>오늘의 흐름</span><b>'+score+'점</b></div></div><div class="reading">'+cards.map(([a,k])=>'<article><h3>'+a+'</h3><p>'+P(q[k],h>>>4)+'</p></article>').join('')+'</div>';$('#r').classList.add('show');$('#r').scrollIntoView({behavior:'smooth'})};</script></html>
